{{ define "main" }}
  <div class="reading-progress" aria-hidden="true"></div>
  <article>
    <header class="single-header">
      {{ with .Params.image }}
        {{ with $.Resources.GetMatch . }}
          <img src="{{ .RelPermalink }}" alt="{{ $.Title }}" class="article-image">
        {{ end }}
      {{ end }}
      <h1{{ with .File }} style="view-transition-name: t-{{ .UniqueID }}"{{ end }}>{{ .Title }}</h1>
      <div class="single-meta">
        <time datetime="{{ .Date | time.Format "2006-01-02T15:04:05-07:00" }}">{{ .Date | time.Format ":date_long" }}</time>
        {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
      </div>
    </header>
    <div class="single-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
